# Maritime Combat Units Mod - English localization
# Unit names and descriptions for all naval combat units

# -----------------------------------------------------------------------
# Frigate  (Unit Type ID 100)
# -----------------------------------------------------------------------
Frigate=Frigate
Frigate_desc=A fast and agile sailing warship armed with cannons along its sides. Ideal for patrol, escort, and hit-and-run engagements on the high seas.

Heavy Frigate=Heavy Frigate
Heavy Frigate_desc=A reinforced frigate carrying a heavier broadside battery. Capable of engaging larger vessels while retaining its speed advantage.

Frigate Squadron=Frigate Squadron
Frigate Squadron_desc=A coordinated formation of frigates acting as a single tactical unit. Their combined firepower can overwhelm most opponents through superior numbers.

# -----------------------------------------------------------------------
# Ship of the Line  (Unit Type ID 101)
# -----------------------------------------------------------------------
Ship of the Line=Ship of the Line
Ship of the Line_desc=A massive three-masted warship carrying rows of heavy cannon on multiple gun decks. The backbone of any serious naval power in the age of sail.

2nd Rate Ship=2nd Rate Ship
2nd Rate Ship_desc=A powerful ship-of-the-line with nearly a hundred guns. Only barely outclassed by the largest first-rates, it forms the elite of most battle fleets.

1st Rate Ship=1st Rate Ship
1st Rate Ship_desc=The pinnacle of wooden warship design. Mounting over a hundred guns across three gun decks, this behemoth dictates the outcome of fleet engagements.

# -----------------------------------------------------------------------
# Ironclad  (Unit Type ID 102)
# -----------------------------------------------------------------------
Ironclad=Ironclad
Ironclad_desc=The dawn of the steam-powered armoured warship. Its iron plating renders wooden ships obsolete and ushers in a new era of naval warfare.

Advanced Ironclad=Advanced Ironclad
Advanced Ironclad_desc=An improved ironclad with stronger armour plating and more powerful rifled guns. Nearly invulnerable to older artillery.

Ironclad Dreadnought=Ironclad Dreadnought
Ironclad Dreadnought_desc=A pre-dreadnought behemoth combining heavy armour, steam propulsion, and a formidable main battery. The supreme warship of the industrial age.

# -----------------------------------------------------------------------
# Battleship  (Unit Type ID 103)
# -----------------------------------------------------------------------
Battleship=Battleship
Battleship_desc=A modern steel warship carrying large-calibre naval guns in armoured turrets. The symbol of national power projection on the world's oceans.

Dreadnought=Dreadnought
Dreadnought_desc=A revolutionary all-big-gun battleship that rendered every previous warship obsolete overnight. Its uniform armament and high speed set the standard for naval arms races.

Super Battleship=Super Battleship
Super Battleship_desc=The ultimate expression of battleship design. Armed with the largest naval guns ever built and protected by the thickest armour, it dominates any sea it sails.

# -----------------------------------------------------------------------
# Naval Technologies  (IDs 500-505)
# -----------------------------------------------------------------------
NavalWarfare=Naval Warfare
NavalWarfare_desc=Formalised doctrines for deploying warships in fleet engagements. Unlocks Ironclad construction.

SteamPropulsion=Steam Propulsion
SteamPropulsion_desc=Application of the steam engine to naval vessels, freeing warships from dependence on wind. Unlocks the Advanced Ironclad.

IronHulls=Iron Hulls
IronHulls_desc=Replacement of wooden ship framing with wrought iron, dramatically increasing hull strength and resistance to shellfire. Unlocks the Ironclad Dreadnought.

SteelNavalEngineering=Steel Naval Engineering
SteelNavalEngineering_desc=All-steel construction and high-pressure turbine engines enable larger, faster, and more heavily armed capital ships. Unlocks the Battleship.

ModernNavalGunnery=Modern Naval Gunnery
ModernNavalGunnery_desc=Centralised fire control, range-finding instruments, and uniform large-calibre main batteries revolutionise naval combat. Unlocks the Dreadnought.

NavalSupremacy=Naval Supremacy
NavalSupremacy_desc=The mastery of all naval arts — propulsion, armour, firepower, and fleet tactics — embodied in the most powerful warships ever built. Unlocks the Super Battleship.
