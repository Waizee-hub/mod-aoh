# Maritime Combat Units Mod - Localisation française
# Noms et descriptions des unités navales de combat
# Types d'unités : Frégate (100), Vaisseau de ligne (101), Cuirassé à vapeur (102), Cuirassé (103), Destroyer (104)
# Technologies : Arbre naval (500-505), Arbre destroyer (510-512)

# -----------------------------------------------------------------------
# Frégate  (ID type d'unité 100)
# -----------------------------------------------------------------------
Frigate=Frégate
Frigate_desc=Un voilier de guerre rapide et agile armé de canons sur ses flancs. Idéal pour la patrouille, l'escorte et les engagements éclair en haute mer.

Heavy Frigate=Frégate lourde
Heavy Frigate_desc=Une frégate renforcée dotée d'une bordée plus puissante. Capable d'affronter de plus grands navires tout en conservant son avantage en vitesse.

Frigate Squadron=Escadron de frégates
Frigate Squadron_desc=Une formation coordonnée de frégates agissant comme une seule unité tactique. Leur puissance de feu combinée peut submerger la plupart des adversaires.

# -----------------------------------------------------------------------
# Vaisseau de ligne  (ID type d'unité 101)
# -----------------------------------------------------------------------
Ship of the Line=Vaisseau de ligne
Ship of the Line_desc=Un immense voilier de guerre à trois mâts portant des rangées de lourds canons sur plusieurs ponts. Le pilier de toute grande puissance navale à l'ère de la voile.

2nd Rate Ship=Vaisseau de 2e rang
2nd Rate Ship_desc=Un puissant vaisseau de ligne armé de près d'une centaine de canons. À peine surpassé par les vaisseaux de premier rang, il forme l'élite de la plupart des flottes de bataille.

1st Rate Ship=Vaisseau de 1er rang
1st Rate Ship_desc=Le summum de la conception des navires de guerre en bois. Avec plus d'une centaine de canons sur trois ponts, ce colosse dicte l'issue des batailles navales.

# -----------------------------------------------------------------------
# Cuirassé à vapeur  (ID type d'unité 102)
# -----------------------------------------------------------------------
Ironclad=Cuirassé à vapeur
Ironclad_desc=L'aube du navire de guerre blindé à propulsion vapeur. Son blindage en fer rend les navires en bois obsolètes et inaugure une nouvelle ère de la guerre navale.

Advanced Ironclad=Cuirassé à vapeur avancé
Advanced Ironclad_desc=Un cuirassé amélioré avec un blindage plus épais et des canons rayés plus puissants. Quasi invulnérable à l'artillerie ancienne.

Ironclad Dreadnought=Dreadnought blindé
Ironclad Dreadnought_desc=Un colosse pré-dreadnought alliant blindage lourd, propulsion à vapeur et une formidable batterie principale. Le navire de guerre suprême de l'ère industrielle.

# -----------------------------------------------------------------------
# Cuirassé  (ID type d'unité 103)
# -----------------------------------------------------------------------
Battleship=Cuirassé
Battleship_desc=Un navire de guerre moderne en acier portant des canons navals de gros calibre dans des tourelles blindées. Le symbole de la puissance de projection nationale sur les océans.

Dreadnought=Dreadnought
Dreadnought_desc=Un cuirassé révolutionnaire à armement uniforme de gros calibres qui a rendu tous les navires précédents obsolètes du jour au lendemain. Sa conception a lancé les courses aux armements navals.

Super Battleship=Super cuirassé
Super Battleship_desc=L'expression ultime de la conception du cuirassé. Armé des plus grands canons navals jamais construits et protégé par le blindage le plus épais, il domine tous les océans qu'il parcourt.

# -----------------------------------------------------------------------
# Technologies navales  (IDs 500-505)
# -----------------------------------------------------------------------
NavalWarfare=Guerre navale
NavalWarfare_desc=Doctrines formalisées pour le déploiement de navires de guerre en engagements de flotte. Débloque la construction du cuirassé à vapeur.

SteamPropulsion=Propulsion à vapeur
SteamPropulsion_desc=Application du moteur à vapeur aux navires de guerre, affranchissant les flottes de la dépendance au vent. Débloque le cuirassé à vapeur avancé.

IronHulls=Coques en fer
IronHulls_desc=Remplacement de la structure bois par du fer forgé, augmentant considérablement la résistance de la coque aux obus. Débloque le dreadnought blindé.

SteelNavalEngineering=Ingénierie navale en acier
SteelNavalEngineering_desc=La construction tout-acier et les turbines à haute pression permettent des navires capitaux plus grands, plus rapides et mieux armés. Débloque le cuirassé.

ModernNavalGunnery=Artillerie navale moderne
ModernNavalGunnery_desc=Contrôle de tir centralisé, télémètres et batteries principales à gros calibres uniformes révolutionnent le combat naval. Débloque le dreadnought.

NavalSupremacy=Suprématie navale
NavalSupremacy_desc=La maîtrise totale de tous les arts navals — propulsion, blindage, puissance de feu et tactiques de flotte — incarnée dans les navires de guerre les plus puissants jamais construits. Débloque le super cuirassé.

# -----------------------------------------------------------------------
# Destroyer / Contre-torpilleur  (ID type d'unité 104)
# -----------------------------------------------------------------------
Torpedo Boat=Torpilleur
Torpedo Boat_desc=Un petit navire à vapeur rapide armé de torpilles autopropulsées. Peu coûteux à construire et assez rapide pour menacer les plus grands navires de guerre d'une attaque torpille bien placée.

Destroyer=Contre-torpilleur
Destroyer_desc=Un navire de guerre rapide et polyvalent conçu pour escorter les flottes, chasser les torpilleurs ennemis et lancer ses propres attaques à la torpille. Sa vitesse et sa puissance de feu en font un atout indispensable pour toute flotte.

Fleet Destroyer=Destroyer de flotte
Fleet Destroyer_desc=Un destroyer lance-missiles moderne alliant grande vitesse, missiles de précision à longue portée et capteurs avancés. Capable d'engager simultanément des cibles de surface, aériennes et sous-marines.

# -----------------------------------------------------------------------
# Technologies des destroyers  (IDs 510-512)
# -----------------------------------------------------------------------
TorpedoWarfare=Guerre à la torpille
TorpedoWarfare_desc=Développement de projectiles sous-marins autopropulsés capables de couler des navires blindés. Débloque le torpilleur, une nouvelle unité navale de combat rapide.

DestroyerDesign=Conception du contre-torpilleur
DestroyerDesign_desc=Doctrine d'ingénierie pour des navires de guerre rapides et polyvalents capables de protéger les flottes et de mener des raids indépendants. Débloque le contre-torpilleur.

GuidedMissileSystems=Systèmes de missiles guidés
GuidedMissileSystems_desc=Les missiles à guidage de précision remplacent les canons et torpilles conventionnels, étendant considérablement la portée de combat et la polyvalence des navires de guerre. Débloque le destroyer de flotte.
